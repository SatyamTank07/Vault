server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Encrypted image uploads go through /api/upload.
    client_max_body_size 25m;

    # API routes: everything under /api/, plus notes CRUD and the health check.
    location ~ ^/(api/|notes(/|$)|health$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker and manifest must be revalidated so a new deploy reaches installed apps.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        types {
            application/javascript js;
            application/manifest+json webmanifest;
        }
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Everything else is the SPA. index.html must not be cached so new deploys show up.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
